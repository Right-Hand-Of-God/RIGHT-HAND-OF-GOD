<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIFT - Ministers' Hangout Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #6C63FF;
            --secondary: #4A42E8;
            --accent: #FF6584;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
        }

        .form-container {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .form-container:hover {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .form-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        .checkbox-option, .radio-option {
            transition: all 0.2s ease;
        }

        .checkbox-option:hover, .radio-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(108, 99, 255, 0.3);
        }

        .volunteer-btn {
            background: linear-gradient(135deg, var(--accent), #FF3D60);
        }

        .volunteer-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(255, 101, 132, 0.3);
        }

        @media (max-width: 640px) {
            .form-container {
                width: 95%;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="form-container bg-white rounded-2xl w-full max-w-3xl overflow-hidden">
        <!-- Header Section -->
        <div class="form-header text-white p-6 text-center">
            <img src="https://placehold.co/150x150" alt="SHIFT Ministers' Hangout Logo - Circular logo with a modern cross and people silhouette in purple and white" class="mx-auto h-24 w-24 object-cover rounded-full mb-4 border-4 border-white">
            <h1 class="text-3xl font-bold mb-2">SHIFT - Ministers' Hangout</h1>
            <p class="opacity-90">Join us for an unforgettable spiritual experience and fellowship</p>
        </div>

        <!-- Registration Form -->
        <form class="p-6 md:p-8">
            <!-- Personal Information Section -->
            <div class="mb-8">
                <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">Personal Information</h2>
                
                <!-- Full Name -->
                <div class="mb-5">
                    <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                
                <!-- Gender -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Gender *</label>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <label class="radio-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="radio" name="gender" value="Male" class="text-purple-600">
                            <span>Male</span>
                        </label>
                        <label class="radio-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="radio" name="gender" value="Female" class="text-purple-600">
                            <span>Female</span>
                        </label>
                    </div>
                </div>
                
                <!-- Location -->
                <div class="mb-5">
                    <label for="location" class="block text-sm font-medium text-gray-700 mb-1">Location *</label>
                    <input type="text" id="location" name="location" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                
                <!-- Email -->
                <div class="mb-5">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
                    <input type="email" id="email" name="email" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                
                <!-- Contact Number -->
                <div class="mb-5">
                    <label for="contact" class="block text-sm font-medium text-gray-700 mb-1">Contact Number *</label>
                    <input type="tel" id="contact" name="contact" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" 
                        placeholder="Include country code">
                </div>
            </div>
            
            <!-- Event Specific Section -->
            <div class="mb-8">
                <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">Event Details</h2>
                
                <!-- Will you be around? -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Will you be attending in person? *</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="radio-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="radio" name="attending" value="Yes" class="text-purple-600" required>
                            <span>Yes</span>
                        </label>
                        <label class="radio-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="radio" name="attending" value="No" class="text-purple-600" required>
                            <span>No</span>
                        </label>
                    </div>
                </div>
                
                <!-- How did you hear about us? -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">How did you hear about this event? *</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="radio-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="radio" name="source" value="Friend" class="text-purple-600" required>
                            <span>A Friend</span>
                        </label>
                        <label class="radio-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="radio" name="source" value="Social Media" class="text-purple-600" required>
                            <span>Social Media</span>
                        </label>
                    </div>
                </div>
                
                <!-- Expectations -->
                <div class="mb-5">
                    <label for="expectations" class="block text-sm font-medium text-gray-700 mb-1">What are your expectations from this event? *</label>
                    <textarea id="expectations" name="expectations" rows="3" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
                </div>
                
                <!-- Anticipated Activities -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">What activities are you looking forward to? *</label>
                    <textarea id="activities" name="activities" rows="3" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
                </div>
            </div>
            
            <!-- Interests Section -->
            <div class="mb-8">
                <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">Your Interests</h2>
                
                <!-- Favorite Indoor Games -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Your favorite indoor games</label>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <label class="checkbox-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="checkbox" name="games" value="Ludo" class="text-purple-600">
                            <span>Ludo</span>
                        </label>
                        <label class="checkbox-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="checkbox" name="games" value="Chess" class="text-purple-600">
                            <span>Chess</span>
                        </label>
                        <label class="checkbox-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="checkbox" name="games" value="Scrabble" class="text-purple-600">
                            <span>Scrabble</span>
                        </label>
                        <label class="checkbox-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="checkbox" name="games" value="Table Tennis" class="text-purple-600">
                            <span>Table Tennis</span>
                        </label>
                        <label class="checkbox-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="checkbox" name="games" value="Video Games" class="text-purple-600">
                            <span>Video Games</span>
                        </label>
                        <label class="checkbox-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="checkbox" name="games" value="Other" class="text-purple-600">
                            <span>Other</span>
                        </label>
                    </div>
                </div>
                
                <!-- Volunteer Opportunities -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Interested in volunteering for: (Check all that apply)</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <label class="checkbox-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="checkbox" name="volunteer" value="Publicity" class="text-purple-600">
                            <span>Publicity Team</span>
                        </label>
                        <label class="checkbox-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="checkbox" name="volunteer" value="Ushering/Protocol" class="text-purple-600">
                            <span>Ushering/Protocol</span>
                        </label>
                        <label class="checkbox-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="checkbox" name="volunteer" value="Intercessor" class="text-purple-600">
                            <span>Intercessor</span>
                        </label>
                        <label class="checkbox-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="checkbox" name="volunteer" value="Welfare" class="text-purple-600">
                            <span>Welfare</span>
                        </label>
                        <label class="checkbox-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="checkbox" name="volunteer" value="Logistics" class="text-purple-600">
                            <span>Logistics</span>
                        </label>
                        <label class="checkbox-option flex items-center space-x-2 p-3 border rounded-lg cursor-pointer">
                            <input type="checkbox" name="volunteer" value="Other" class="text-purple-600">
                            <span>Other</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <!-- Form Submission -->
            <div class="flex flex-col md:flex-row gap-4">
                <button type="submit" class="submit-btn text-white font-semibold py-3 px-6 rounded-lg flex-1">
                    <i class="fas fa-paper-plane mr-2"></i> Submit Registration
                </button>
                
                <a href="https://wa.me/your-group-link" target="_blank" class="volunteer-btn text-white font-semibold py-3 px-6 rounded-lg flex-1 text-center">
                    <i class="fab fa-whatsapp mr-2"></i> Join Volunteers WhatsApp
                </a>
            </div>
        </form>
    </div>

    <!-- Confirmation Modal (Hidden by default) -->
    <div id="confirmationModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-xl max-w-md mx-4">
            <div class="text-center mb-6">
                <svg class="mx-auto h-16 w-16 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <h3 class="text-2xl font-bold text-gray-800 mt-4">Registration Successful!</h3>
                <p class="text-gray-600 mt-2">Thank you for registering for SHIFT - Ministers' Hangout. We're excited to have you join us!</p>
            </div>
            <button onclick="closeModal()" class="w-full bg-purple-600 text-white py-2 rounded-lg font-semibold">Continue</button>
        </div>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('confirmationModal').classList.remove('hidden');
            // Here you would typically send data to your server
            // For demo, we're just showing the confirmation modal
        });

        function closeModal() {
            document.getElementById('confirmationModal').classList.add('hidden');
        }

        // Replace with your actual WhatsApp group link
        document.querySelector('.volunteer-btn').addEventListener('click', function() {
            // In a real implementation, you would track this click
            // For demo purposes, we're just following the link
        });
    </script>
</body>
</html>
