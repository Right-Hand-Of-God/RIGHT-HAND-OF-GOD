<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Minister's Hangout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom right, #021b52,#01142b);
      color: white;
    }
    .form-section {
      background: linear-gradient(to right, #021b52,#01142b);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    .input-field {
      background-color: #374151;
      border: 1px solid #4b5563;
      color: white;
      transition: all 0.3s ease;
    }
    .input-field:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.4);
      background-color: #4b5563;
    }
    .btn-primary {
      background: linear-gradient(to right, #6366f1, #818cf8);
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(129, 140, 248, 0.3);
    }
    .btn-primary:hover {
      background: linear-gradient(to right, #4f46e5, #6366f1);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(129, 140, 248, 0.5);
    }
    .btn-whatsapp {
      background-color: #25D366;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
    }
    .btn-whatsapp:hover {
      background-color: #128C7E;
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(18, 140, 126, 0.5);
    }
    #successModal .modal-box {
      background: linear-gradient(to right, #1f2937, #374151);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4 sm:px-6 lg:px-8">

  <div class="w-full max-w-4xl">
    <div class="form-section p-6 sm:p-10">
      <div class="flex justify-center mb-4">
        <img src="DIDINE_GRACE_LOGO-removebg-preview.png" alt="Minister's Hangout Logo" class="h-16 w-auto">
      </div>

      <a href="/" class="flex items-center mb-6 text-indigo-400 hover:underline">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Back to Home
      </a>

      <h1 class="text-3xl sm:text-4xl font-bold text-center mb-8 text-indigo-300">Register for Minister's Hangout</h1>
      <form id="registrationForm" action="https://formspree.io/f/mblybjvj" method="POST" class="space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label class="block mb-2">Full Name *</label>
            <input type="text" name="fullName" required class="w-full input-field px-4 py-2.5 rounded-lg">
          </div>
          <div>
            <label class="block mb-2">Gender *</label>
            <select name="gender" required class="w-full input-field px-4 py-2.5 rounded-lg">
              <option value="" disabled selected>Select Gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
              <option value="prefer-not">Prefer not to say</option>
            </select>
          </div>
          <div>
            <label class="block mb-2">Location *</label>
            <input type="text" name="location" required class="w-full input-field px-4 py-2.5 rounded-lg">
          </div>
          <div>
            <label class="block mb-2">Gmail *</label>
            <input type="email" name="email" required class="w-full input-field px-4 py-2.5 rounded-lg">
          </div>
          <div>
            <label class="block mb-2">Contact Number *</label>
            <input type="tel" name="contactNo" required class="w-full input-field px-4 py-2.5 rounded-lg">
          </div>
        </div>

        <div>
          <p class="mb-3">Will you be available for the hangout? *</p>
          <div class="flex gap-6">
            <label><input type="radio" name="availability" value="yes" required> Yes</label>
            <label><input type="radio" name="availability" value="no"> No</label>
          </div>
        </div>

        <div>
          <p class="mb-3">How did you hear about this? *</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <label><input type="radio" name="referral" value="friend" required> A Friend</label>
            <label><input type="radio" name="referral" value="social"> Social Media</label>
          </div>
        </div>

        <div>
          <label class="block mb-2">Favorite indoor games (select any):</label>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <label><input type="checkbox" name="favoriteGames[]" value="ludo"> Ludo</label>
            <label><input type="checkbox" name="favoriteGames[]" value="chess"> Chess</label>
            <label><input type="checkbox" name="favoriteGames[]" value="monopoly"> Monopoly</label>
            <label><input type="checkbox" name="favoriteGames[]" value="cards"> Cards</label>
            <label><input type="checkbox" name="favoriteGames[]" value="scrabble"> Scrabble</label>
            <label><input type="checkbox" name="favoriteGames[]" value="other"> Other</label>
          </div>
        </div>

        <div>
          <label class="block mb-2">What are your expectations from the Hangout? *</label>
          <textarea name="expectations" rows="4" required class="w-full input-field px-4 py-2.5 rounded-lg"></textarea>
        </div>

        <div>
          <label class="block mb-2">What activities do you anticipate? (optional)</label>
          <textarea name="anticipations" rows="3" class="w-full input-field px-4 py-2.5 rounded-lg"></textarea>
        </div>

        <div>
          <h3 class="text-xl font-semibold text-indigo-400 mb-2">Volunteer Opportunities</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <label><input type="checkbox" name="volunteerRoles[]" value="publicity"> Publicity</label>
            <label><input type="checkbox" name="volunteerRoles[]" value="ushering"> Ushering/Protocol</label>
            <label><input type="checkbox" name="volunteerRoles[]" value="intercessor"> Intercessor</label>
            <label><input type="checkbox" name="volunteerRoles[]" value="welfare"> Welfare</label>
            <label><input type="checkbox" name="volunteerRoles[]" value="logistics"> Logistics</label>
          </div>
        </div>

        <div class="flex flex-col gap-4 items-center sm:flex-row sm:justify-end">
          <button type="submit" class="btn-primary px-8 py-3 rounded-lg font-medium">Complete Registration</button>
          <a href="https://chat.whatsapp.com/DToRlhCfc1i6Rqb6pBe3vN" target="_blank" class="btn-whatsapp px-6 py-3 rounded-lg inline-block">Join WhatsApp Group</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Success Modal -->
  <div id="successModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black bg-opacity-50">
    <div class="modal-box max-w-sm w-full mx-4 rounded-xl shadow-lg p-6 text-center">
      <h2 class="text-xl font-semibold mb-3 text-green-400">✅ Registration Successful!</h2>
      <p class="mb-4">Thank you for signing up for the Minister's Hangout.</p>
      <button id="closeModalBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-md font-medium">Close</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("registrationForm");
      const successModal = document.getElementById("successModal");
      const closeModalBtn = document.getElementById("closeModalBtn");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const formData = new FormData(form);

        try {
          const response = await fetch(form.action, {
            method: form.method,
            headers: { 'Accept': 'application/json' },
            body: formData
          });

          if (response.ok) {
            successModal.classList.remove("hidden");
            form.reset();
            setTimeout(() => {
              successModal.classList.add("hidden");
            }, 60000);
          } else {
            alert("There was a problem with your submission.");
          }
        } catch (error) {
          alert("Network error. Please try again later.");
        }
      });

      closeModalBtn.addEventListener("click", function () {
        successModal.classList.add("hidden");
      });
    });
  </script>

</body>
</html>
