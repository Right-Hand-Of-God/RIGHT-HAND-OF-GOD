<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RHOG STUDIO – Graphic Design & Large Printing</title>
  <link rel="icon" href="RHOG LOGO.png" type="image/png">
  <!-- Preconnect to critical origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Optimized font: Inter with weights 400,600,700 & display swap -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* base & custom elegance */
    body {
      font-family: 'Inter', sans-serif;
      background: #0b0b0b;
      color: #f0f0f0;
    }
    /* subtle grain texture overlay for depth (very light) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }
    .container { position: relative; z-index: 1; }
    /* Glass-morphism header */
    .glass-header {
      background: rgba(20, 20, 20, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 215, 0, 0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .glow-text {
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
    }
    /* Portfolio card refinement */
    .portfolio-item {
      background: rgba(26, 26, 26, 0.8);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 215, 0, 0.06);
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform: translateY(0);
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.6);
    }
    .portfolio-item:hover {
      transform: translateY(-8px) scale(1.01);
      border-color: rgba(255, 215, 0, 0.25);
      box-shadow: 0 20px 40px -12px rgba(255, 215, 0, 0.15);
    }
    .portfolio-item .portfolio-img {
      transition: transform 0.6s ease, filter 0.4s ease;
      filter: saturate(0.9) brightness(0.95);
      background: #1e1e1e;
    }
    .portfolio-item:hover .portfolio-img {
      transform: scale(1.04);
      filter: saturate(1.1) brightness(1.02);
    }
    .portfolio-title {
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.6) 100%);
      padding: 1rem 0.75rem 0.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      border-top: 1px solid rgba(255,215,0,0.08);
    }
    /* Modal improvements */
    .modal-backdrop {
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .modal-content {
      background: #121212;
      border-radius: 1.5rem;
      box-shadow: 0 40px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,215,0,0.1);
      overflow: hidden;
    }
    .modal-close-btn {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.2s;
    }
    .modal-close-btn:hover {
      background: rgba(255,215,0,0.2);
      transform: rotate(90deg);
    }
    /* CTA button with shimmer */
    .cta-btn {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px -6px rgba(255, 215, 0, 0.25);
      letter-spacing: 0.03em;
    }
    .cta-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 200%;
      height: 200%;
      background: linear-gradient(60deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: rotate(25deg);
      transition: all 0.6s;
    }
    .cta-btn:hover::after {
      left: 100%;
    }
    .cta-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 28px -8px rgba(255, 215, 0, 0.4);
    }
    /* Section headings */
    .section-heading {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(251, 191, 36, 0.1);
    }
    .sub-heading {
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      color: #a0a0a0;
    }
    /* lazy load blur */
    .portfolio-img[lazy=loading] { opacity: 0.4; transform: scale(0.98); }
    .portfolio-img[lazy=loaded] { opacity: 1; }
  </style>
  <!-- Defer JS for non-blocking -->
  <script defer>
    (function() {
      // Lazy image observer with better placeholder
      if ('IntersectionObserver' in window) {
        const images = document.querySelectorAll('.portfolio-img');
        const imageObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const img = entry.target;
              const src = img.getAttribute('data-src');
              if (src && img.src !== src) {
                img.src = src;
                img.setAttribute('lazy', 'loading');
                img.onload = () => {
                  img.setAttribute('lazy', 'loaded');
                  img.removeAttribute('data-src');
                };
                img.onerror = () => {
                  img.setAttribute('lazy', 'loaded');
                  img.removeAttribute('data-src');
                };
              }
              imageObserver.unobserve(img);
            }
          });
        }, { rootMargin: '120px' });
        images.forEach(img => imageObserver.observe(img));
      } else {
        document.querySelectorAll('.portfolio-img').forEach(img => {
          const src = img.getAttribute('data-src');
          if (src) { img.src = src; img.removeAttribute('data-src'); }
        });
      }

      // Modal logic
      const modal = document.getElementById('imageModal');
      const modalImage = document.getElementById('modalImage');
      const closeBtn = document.querySelector('.modal-close-btn');

      function openModal(src) {
        if (!src || src.trim() === '') return;
        modalImage.src = src;
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        modal.style.display = 'none';
        document.body.style.overflow = '';
        setTimeout(() => { if (modal.style.display === 'none') modalImage.src = ''; }, 120);
      }

      // Event delegation on grid
      const grid = document.querySelector('.portfolio-grid');
      if (grid) {
        grid.addEventListener('click', (e) => {
          const item = e.target.closest('.portfolio-item');
          if (item) {
            const src = item.getAttribute('data-src');
            if (src && src.trim() !== '') openModal(src);
          }
        });
        grid.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            const item = e.target.closest('.portfolio-item');
            if (item) { e.preventDefault(); 
              const src = item.getAttribute('data-src');
              if (src && src.trim() !== '') openModal(src);
            }
          }
        });
      }

      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.style.display === 'flex') closeModal(); });
      if (closeBtn) closeBtn.addEventListener('click', closeModal);
      window.closeModal = closeModal;
    })();
  </script>
</head>
<body>
  <!-- Header with glass effect -->
  <header class="glass-header sticky top-0 z-50 p-4 rounded-b-2xl mb-8">

        </div>
        <h1 class="text-3xl font-extrabold glow-text" style="color: #fbbf24;">RHOG STUDIO</h1>
      </div>
      <div class="hidden md:flex items-center gap-6 text-sm text-gray-300">
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span> Graphic Design</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span> Large Printing</span>
      </div>

            <img class="portfolio-img w-full h-56 object-cover"

  <!-- Modal -->

</body>
</html>
